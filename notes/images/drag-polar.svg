<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t1 d1">
  <title id="t1">Total drag is parasite plus induced with opposite airspeed trends</title>
  <desc id="d1">Graph of parasite drag rising with speed, induced falling, total U-shaped with L/D max marked.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="12" fill="url(#bg)"/>
  <text x="24" y="28" fill="#3dd6c6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">DRAG POLAR (TRAINING PICTURE)</text>
  <text x="24" y="50" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">Parasite rises with speed² · Induced falls as speed rises · Total is U-shaped</text>

  <line x1="70" y1="250" x2="420" y2="250" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <line x1="70" y1="250" x2="70" y2="80" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <text x="230" y="275" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">Airspeed →</text>
  <text x="28" y="160" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12" transform="rotate(-90 28,160)">Drag</text>

  <!-- parasite rising -->
  <path d="M80,230 Q200,220 400,100" fill="none" stroke="#ff9f6b" stroke-width="2.5"/>
  <!-- induced falling -->
  <path d="M80,100 Q200,140 400,230" fill="none" stroke="#7ecbff" stroke-width="2.5"/>
  <!-- total U -->
  <path d="M80,200 Q150,120 240,115 Q320,120 400,200" fill="none" stroke="#3ecf8e" stroke-width="3"/>
  <circle cx="240" cy="115" r="6" fill="#3ecf8e"/>
  <text x="250" y="110" fill="#3ecf8e" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Min drag ≈ L/Dmax region</text>

  <text x="360" y="95" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="12">Parasite</text>
  <text x="100" y="95" fill="#7ecbff" font-family="system-ui,sans-serif" font-size="12">Induced</text>
  <text x="300" y="200" fill="#3ecf8e" font-family="system-ui,sans-serif" font-size="12">Total</text>

  <rect x="460" y="80" width="230" height="180" rx="10" fill="#182338" stroke="rgba(255,255,255,0.08)"/>
  <text x="475" y="110" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Mental model</text>
  <text x="475" y="140" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="12">Slow → induced dominates</text>
  <text x="475" y="165" fill="#7ecbff" font-family="system-ui,sans-serif" font-size="12">Fast → parasite dominates</text>
  <text x="475" y="190" fill="#3ecf8e" font-family="system-ui,sans-serif" font-size="12">Valley → best L/D (glide)</text>
  <text x="475" y="225" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">Flaps/gear shift the curves</text>
  <text x="475" y="245" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">(“dirty” = more parasite)</text>
</svg>
