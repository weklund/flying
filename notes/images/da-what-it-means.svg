<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t1 d1">
  <title id="t1">Density altitude: the airplane performs as if higher than field elevation</title>
  <desc id="d1">Mountain airport at field elevation with a dashed marker much higher labeled density altitude; airplane feels thin air.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#121a2b"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a52"/>
      <stop offset="100%" stop-color="#1a2438"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="12" fill="url(#sky)"/>
  <text x="24" y="28" fill="#3dd6c6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">WHAT DENSITY ALTITUDE MEANS</text>
  <text x="24" y="50" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">How high the airplane “thinks” it is — based on air density, not just field elevation</text>

  <!-- Mountains -->
  <path d="M0,260 L80,140 L140,200 L220,90 L300,180 L380,70 L480,160 L560,100 L640,170 L720,130 L720,300 L0,300 Z" fill="url(#mtn)" opacity="0.9"/>
  <!-- Runway plateau -->
  <rect x="200" y="188" width="160" height="10" rx="2" fill="#555e6e"/>
  <rect x="210" y="191" width="20" height="3" fill="rgba(255,255,255,0.35)"/>
  <rect x="250" y="191" width="20" height="3" fill="rgba(255,255,255,0.35)"/>
  <rect x="290" y="191" width="20" height="3" fill="rgba(255,255,255,0.35)"/>

  <!-- Plane on field -->
  <g transform="translate(250,175)">
    <ellipse cx="30" cy="8" rx="28" ry="6" fill="#5b9dff"/>
    <rect x="20" y="-2" width="28" height="6" rx="2" fill="#7ecbff"/>
    <polygon points="48,0 62,4 48,8" fill="#3dd6c6"/>
  </g>

  <!-- Field elev marker -->
  <line x1="380" y1="193" x2="520" y2="193" stroke="#9aa8c7" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="380" cy="193" r="5" fill="#9aa8c7"/>
  <text x="530" y="198" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Field elevation</text>
  <text x="530" y="216" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">e.g. 5,000 ft MSL</text>

  <!-- DA marker higher -->
  <line x1="380" y1="85" x2="520" y2="85" stroke="#ff9f6b" stroke-width="2.5"/>
  <circle cx="380" cy="85" r="6" fill="#ff9f6b"/>
  <text x="530" y="90" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Density altitude</text>
  <text x="530" y="108" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="12">e.g. 8,500 ft (hot day)</text>

  <!-- Double arrow between -->
  <line x1="400" y1="100" x2="400" y2="178" stroke="rgba(240,193,75,0.8)" stroke-width="2"/>
  <polygon points="400,95 395,105 405,105" fill="#f0c14b"/>
  <polygon points="400,183 395,173 405,173" fill="#f0c14b"/>
  <text x="410" y="145" fill="#f0c14b" font-family="system-ui,sans-serif" font-size="12">performs like</text>
  <text x="410" y="160" fill="#f0c14b" font-family="system-ui,sans-serif" font-size="12">higher airport</text>

  <text x="24" y="285" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">Schematic · educational</text>
</svg>
