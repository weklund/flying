<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t4 d4">
  <title id="t4">Positive static and dynamic stability illustrated with a ball</title>
  <desc id="d4">Three bowls: positive static returns, neutral stays, negative diverges; plus dynamic damping sketch.</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="720" height="300" rx="12" fill="url(#bg4)"/>
  <text x="24" y="28" fill="#3dd6c6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">STATIC vs DYNAMIC STABILITY</text>
  <text x="24" y="50" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">Static = initial tendency · Dynamic = behavior over time</text>

  <!-- Positive static -->
  <g transform="translate(80,100)">
    <path d="M0,80 Q60,0 120,80" fill="none" stroke="#3ecf8e" stroke-width="3"/>
    <circle cx="75" cy="55" r="12" fill="#3ecf8e"/>
    <text x="60" y="120" fill="#3ecf8e" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Positive static</text>
    <text x="50" y="140" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">Returns toward</text>
    <text x="55" y="155" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">equilibrium</text>
  </g>

  <!-- Neutral -->
  <g transform="translate(280,100)">
    <line x1="0" y1="70" x2="120" y2="70" stroke="#f0c14b" stroke-width="3"/>
    <circle cx="70" cy="58" r="12" fill="#f0c14b"/>
    <text x="55" y="120" fill="#f0c14b" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Neutral static</text>
    <text x="45" y="140" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">Stays displaced</text>
  </g>

  <!-- Negative -->
  <g transform="translate(480,100)">
    <path d="M0,40 Q60,100 120,40" fill="none" stroke="#ff6b7a" stroke-width="3"/>
    <circle cx="85" cy="55" r="12" fill="#ff6b7a"/>
    <text x="50" y="120" fill="#ff6b7a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Negative static</text>
    <text x="45" y="140" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">Diverges further</text>
  </g>

  <text x="24" y="280" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">
    Positive dynamic: oscillations damp out over time · Negative dynamic: oscillations grow
  </text>
</svg>
