<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t1 d1">
  <title id="t1">Forces in a coordinated level turn</title>
  <desc id="d1">Banked airplane with total lift, weight, horizontal component providing centripetal force, and load factor note.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3ecf8e"/></marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff9f6b"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5b9dff"/></marker>
  </defs>
  <rect width="720" height="300" rx="12" fill="url(#bg)"/>
  <text x="24" y="28" fill="#3dd6c6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">FORCES IN A LEVEL TURN</text>
  <text x="24" y="50" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">Lift tilts · vertical part balances weight · horizontal part turns the path · n = 1/cos(φ)</text>

  <g transform="translate(200,160) rotate(-40)">
    <ellipse cx="0" cy="0" rx="75" ry="12" fill="rgba(91,157,255,0.4)" stroke="#e8eefc" stroke-width="2"/>
  </g>
  <!-- Total lift along wing normal approx -->
  <line x1="200" y1="160" x2="145" y2="95" stroke="#3ecf8e" stroke-width="3" marker-end="url(#g)"/>
  <text x="100" y="90" fill="#3ecf8e" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Total lift</text>
  <!-- Vertical component -->
  <line x1="200" y1="160" x2="200" y2="100" stroke="#7ecbff" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="208" y="115" fill="#7ecbff" font-family="system-ui,sans-serif" font-size="11">≈ Weight</text>
  <!-- Horizontal -->
  <line x1="200" y1="160" x2="130" y2="160" stroke="#5b9dff" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="90" y="175" fill="#5b9dff" font-family="system-ui,sans-serif" font-size="11">Horizontal</text>
  <text x="90" y="190" fill="#5b9dff" font-family="system-ui,sans-serif" font-size="11">(centripetal)</text>
  <!-- Weight -->
  <line x1="200" y1="160" x2="200" y2="240" stroke="#ff9f6b" stroke-width="3" marker-end="url(#o)"/>
  <text x="210" y="235" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Weight</text>

  <rect x="400" y="80" width="290" height="180" rx="10" fill="#182338" stroke="rgba(255,255,255,0.08)"/>
  <text x="420" y="110" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="13" font-weight="700">To hold altitude in a turn:</text>
  <text x="420" y="140" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">• Increase total lift (back pressure)</text>
  <text x="420" y="165" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">• Load factor n rises with bank</text>
  <text x="420" y="190" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">• Stall speed rises: Vs = Vs1√n</text>
  <text x="420" y="225" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="12" font-weight="700">60° bank → 2 G · Vs ≈ +41%</text>
</svg>
