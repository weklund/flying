<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t3 d3">
  <title id="t3">Density altitude from pressure altitude and temperature vs ISA</title>
  <desc id="d3">ISA temperature ladder and formula DA equals PA plus 120 times OAT minus ISA temp.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="720" height="320" rx="12" fill="url(#bg3)"/>
  <text x="24" y="28" fill="#3dd6c6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">DENSITY ALTITUDE MATH (DRY / CHART STYLE)</text>
  <text x="24" y="50" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">Compare OAT to standard temp at your PA · ~120 ft DA per °C off ISA</text>

  <!-- ISA ladder -->
  <rect x="40" y="70" width="200" height="220" rx="10" fill="#182338" stroke="rgba(255,255,255,0.08)"/>
  <text x="140" y="95" text-anchor="middle" fill="#5b9dff" font-family="system-ui,sans-serif" font-size="13" font-weight="700">ISA ladder</text>
  <text x="55" y="125" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">0 ft → 15 °C</text>
  <text x="55" y="150" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">5,000 → 5 °C</text>
  <text x="55" y="175" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">10,000 → −5 °C</text>
  <text x="55" y="210" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="12">Lapse ≈ 2 °C</text>
  <text x="55" y="228" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="12">per 1,000 ft</text>
  <text x="55" y="255" fill="#f0c14b" font-family="system-ui,sans-serif" font-size="11">T_ISA ≈ 15 − 2×(PA/1000)</text>

  <!-- Formula box -->
  <rect x="270" y="70" width="420" height="220" rx="10" fill="#182338" stroke="rgba(255,159,107,0.35)"/>
  <text x="290" y="100" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Training formula (°C, feet)</text>
  <text x="290" y="135" fill="#7ecbff" font-family="ui-monospace,Menlo,monospace" font-size="15">DA ≈ PA + 120 × (OAT − T_ISA)</text>
  <text x="290" y="170" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">Hotter than ISA → DA &gt; PA (thin)</text>
  <text x="290" y="192" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">Colder than ISA → DA &lt; PA (dense)</text>
  <text x="290" y="214" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">OAT = T_ISA → DA ≈ PA</text>
  <text x="290" y="250" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="12">Example: PA 5000, OAT 25 °C</text>
  <text x="290" y="270" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="12">T_ISA = 5 °C → ΔT = 20 → +2400 ft</text>
  <text x="290" y="288" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">DA ≈ 7400 ft</text>
</svg>
