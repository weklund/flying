<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t3 d3">
  <title id="t3">Load factor in a level turn increases with bank</title>
  <desc id="d3">Airplane in level turn with weight and lift vectors; load factor n equals 1 over cos bank.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3ecf8e"/>
    </marker>
    <marker id="o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff9f6b"/>
    </marker>
  </defs>
  <rect width="720" height="300" rx="12" fill="url(#bg3)"/>
  <text x="24" y="28" fill="#3dd6c6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">LOAD FACTOR IN A LEVEL TURN</text>
  <text x="24" y="50" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">Lift must support weight and provide centripetal force · n = 1 / cos(φ)</text>

  <!-- Banked airplane simple -->
  <g transform="translate(160,160) rotate(-45)">
    <ellipse cx="0" cy="0" rx="70" ry="12" fill="rgba(91,157,255,0.45)" stroke="#e8eefc" stroke-width="2"/>
    <rect x="-8" y="-8" width="40" height="10" rx="2" fill="#7ecbff"/>
  </g>
  <!-- Weight down -->
  <line x1="160" y1="160" x2="160" y2="240" stroke="#ff9f6b" stroke-width="3" marker-end="url(#o)"/>
  <text x="170" y="230" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Weight</text>
  <!-- Lift perpendicular to wings -->
  <line x1="160" y1="160" x2="100" y2="100" stroke="#3ecf8e" stroke-width="3" marker-end="url(#g)"/>
  <text x="70" y="95" fill="#3ecf8e" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Lift</text>
  <text x="90" y="175" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="12">φ bank</text>

  <!-- Table of values -->
  <rect x="340" y="75" width="350" height="190" rx="10" fill="#182338" stroke="rgba(255,255,255,0.08)"/>
  <text x="360" y="105" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Coordinated level turn (approx.)</text>
  <text x="360" y="135" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">0° bank → n = 1.0 G</text>
  <text x="360" y="160" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">30° → n ≈ 1.15 G</text>
  <text x="360" y="185" fill="#f0c14b" font-family="system-ui,sans-serif" font-size="13">45° → n ≈ 1.41 G</text>
  <text x="360" y="210" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">60° → n = 2.0 G</text>
  <text x="360" y="235" fill="#ff6b7a" font-family="system-ui,sans-serif" font-size="13">75° → n ≈ 3.9 G (rapid rise)</text>
  <text x="360" y="255" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">90° constant-altitude turn not sustainable</text>
</svg>
