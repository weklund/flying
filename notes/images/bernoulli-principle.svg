<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="t1 d1">
  <title id="t1">Bernoulli principle: higher speed, lower static pressure</title>
  <desc id="d1">Two stream tubes: slow flow with high pressure, fast flow with low pressure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5b9dff"/>
    </marker>
    <marker id="arrowHot" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff9f6b"/>
    </marker>
  </defs>
  <rect width="640" height="220" rx="12" fill="url(#bg)"/>
  <text x="24" y="32" fill="#3dd6c6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">BERNOULLI (IDEALIZED)</text>
  <text x="24" y="54" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="14">Speed ↑  →  static pressure ↓  (along a streamline)</text>

  <!-- Slow side -->
  <rect x="40" y="80" width="240" height="100" rx="10" fill="#182338" stroke="rgba(255,255,255,0.08)"/>
  <text x="160" y="105" text-anchor="middle" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Slower flow</text>
  <line x1="70" y1="130" x2="200" y2="130" stroke="#5b9dff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="70" y1="150" x2="170" y2="150" stroke="#5b9dff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="160" y="178" text-anchor="middle" fill="#f0c14b" font-family="system-ui,sans-serif" font-size="13">Higher static pressure</text>

  <!-- Fast side -->
  <rect x="360" y="80" width="240" height="100" rx="10" fill="#182338" stroke="rgba(255,255,255,0.08)"/>
  <text x="480" y="105" text-anchor="middle" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Faster flow</text>
  <line x1="390" y1="125" x2="560" y2="125" stroke="#ff9f6b" stroke-width="3" marker-end="url(#arrowHot)"/>
  <line x1="390" y1="145" x2="560" y2="145" stroke="#ff9f6b" stroke-width="3" marker-end="url(#arrowHot)"/>
  <line x1="390" y1="155" x2="540" y2="155" stroke="#ff9f6b" stroke-width="3" marker-end="url(#arrowHot)"/>
  <text x="480" y="178" text-anchor="middle" fill="#7ecbff" font-family="system-ui,sans-serif" font-size="13">Lower static pressure</text>

  <text x="320" y="135" text-anchor="middle" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="22">→</text>
</svg>
