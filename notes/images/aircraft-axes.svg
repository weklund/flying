<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t3 d3">
  <title id="t3">Three axes of an aircraft through the center of gravity</title>
  <desc id="d3">Airplane silhouette with longitudinal, lateral, and vertical axes labeled pitch roll yaw.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="720" height="280" rx="12" fill="url(#bg3)"/>
  <text x="24" y="28" fill="#3dd6c6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">AXES THROUGH THE CG</text>
  <text x="24" y="50" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">All rotations (moments) are about the center of gravity</text>

  <!-- plane top-ish view simplified side -->
  <g transform="translate(280,150)">
    <!-- fuselage -->
    <ellipse cx="0" cy="0" rx="90" ry="18" fill="rgba(91,157,255,0.35)" stroke="#e8eefc" stroke-width="2"/>
    <!-- wing -->
    <ellipse cx="10" cy="0" rx="20" ry="70" fill="rgba(91,157,255,0.25)" stroke="#e8eefc" stroke-width="1.5"/>
    <!-- tail -->
    <ellipse cx="70" cy="-25" rx="8" ry="28" fill="rgba(91,157,255,0.3)" stroke="#e8eefc"/>
    <circle cx="0" cy="0" r="6" fill="#f0c14b"/>
    <text x="10" y="8" fill="#f0c14b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">CG</text>

    <!-- Longitudinal axis - roll -->
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#ff9f6b" stroke-width="2.5"/>
    <text x="80" y="-12" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Longitudinal</text>
    <text x="80" y="28" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="11">→ roll (ailerons)</text>

    <!-- Lateral axis - pitch -->
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#7ecbff" stroke-width="2.5"/>
    <text x="12" y="-75" fill="#7ecbff" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Lateral</text>
    <text x="12" y="-60" fill="#7ecbff" font-family="system-ui,sans-serif" font-size="11">→ pitch (elevator)</text>

    <!-- Vertical axis - yaw (perspective dash) -->
    <line x1="-40" y1="-50" x2="40" y2="50" stroke="#3ecf8e" stroke-width="2.5" stroke-dasharray="6 3"/>
    <text x="-100" y="-40" fill="#3ecf8e" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Vertical</text>
    <text x="-100" y="-25" fill="#3ecf8e" font-family="system-ui,sans-serif" font-size="11">→ yaw (rudder)</text>
  </g>

  <rect x="480" y="80" width="210" height="160" rx="10" fill="#182338" stroke="rgba(255,255,255,0.08)"/>
  <text x="495" y="110" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Stability names</text>
  <text x="495" y="140" fill="#7ecbff" font-family="system-ui,sans-serif" font-size="12">Longitudinal → pitch</text>
  <text x="495" y="165" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="12">Lateral → roll</text>
  <text x="495" y="190" fill="#3ecf8e" font-family="system-ui,sans-serif" font-size="12">Directional → yaw</text>
  <text x="495" y="220" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">Stability resists disturbance</text>
  <text x="495" y="238" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">about each axis</text>
</svg>
