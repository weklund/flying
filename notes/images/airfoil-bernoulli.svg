<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t3 d3">
  <title id="t3">Cambered airfoil with faster upper flow and pressure difference</title>
  <desc id="d3">Side view of a wing section showing faster streamlines above, lower pressure above, higher pressure below, and net lift.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="aBlue" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7ecbff"/>
    </marker>
    <marker id="aOrange" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff9f6b"/>
    </marker>
    <marker id="aGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3ecf8e"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="12" fill="url(#bg3)"/>
  <text x="24" y="28" fill="#3dd6c6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">AIRFOIL · BERNOULLI PICTURE</text>
  <text x="24" y="50" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">Faster upper flow → lower pressure on top · net aerodynamic force includes lift</text>

  <!-- Relative wind -->
  <line x1="40" y1="160" x2="120" y2="160" stroke="rgba(232,238,252,0.35)" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="40" y="148" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">Relative wind</text>

  <!-- Upper streamlines (fast) -->
  <path d="M130,120 C220,70 380,55 560,100" fill="none" stroke="#7ecbff" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <path d="M130,135 C230,95 390,80 560,115" fill="none" stroke="#7ecbff" stroke-width="2" opacity="0.7" marker-end="url(#aBlue)"/>
  <path d="M130,105 C210,55 370,40 560,90" fill="none" stroke="#7ecbff" stroke-width="2" opacity="0.55" marker-end="url(#aBlue)"/>

  <!-- Lower streamlines (slower) -->
  <path d="M140,195 C250,210 400,215 560,190" fill="none" stroke="#ff9f6b" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <path d="M140,210 C260,225 410,228 560,205" fill="none" stroke="#ff9f6b" stroke-width="2" opacity="0.65" marker-end="url(#aOrange)"/>

  <!-- Airfoil -->
  <path d="M160,170
           C200,168 240,130 320,118
           C400,108 480,125 540,155
           C500,168 420,175 320,172
           C250,170 200,172 160,170 Z"
        fill="rgba(91,157,255,0.35)" stroke="#e8eefc" stroke-width="2"/>

  <!-- Chord line -->
  <line x1="160" y1="170" x2="540" y2="158" stroke="rgba(240,193,75,0.7)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="340" y="188" fill="#f0c14b" font-family="system-ui,sans-serif" font-size="11">chord line</text>

  <!-- Pressure arrows -->
  <line x1="320" y1="100" x2="320" y2="125" stroke="#7ecbff" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="330" y="112" fill="#7ecbff" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Low p (suction)</text>

  <line x1="320" y1="230" x2="320" y2="185" stroke="#ff9f6b" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <text x="330" y="222" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Higher p</text>

  <!-- Lift -->
  <line x1="400" y1="200" x2="400" y2="70" stroke="#3ecf8e" stroke-width="3" marker-end="url(#aGreen)"/>
  <text x="410" y="90" fill="#3ecf8e" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Lift (net)</text>

  <text x="160" y="260" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="12">Leading edge</text>
  <text x="500" y="260" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="12">Trailing edge</text>
  <text x="360" y="300" text-anchor="middle" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">Schematic · not to scale · shares of lift from top vs bottom vary (PHAK)</text>
</svg>
