<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t1 d1">
  <title id="t1">Angle of attack is chord line versus relative wind</title>
  <desc id="d1">Airfoil with chord line, relative wind arrow, and angle of attack labeled; horizon shown separately from AOA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7ecbff"/>
    </marker>
    <marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f0c14b"/>
    </marker>
  </defs>
  <rect width="720" height="280" rx="12" fill="url(#bg)"/>
  <text x="24" y="28" fill="#3dd6c6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">ANGLE OF ATTACK (AOA)</text>
  <text x="24" y="50" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">AOA = angle between chord line and relative wind — not pitch attitude vs horizon</text>

  <!-- Relative wind -->
  <line x1="40" y1="160" x2="200" y2="160" stroke="#7ecbff" stroke-width="3" marker-end="url(#arr)"/>
  <text x="40" y="145" fill="#7ecbff" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Relative wind</text>

  <!-- Chord line rotated -->
  <g transform="translate(220,170) rotate(-18)">
    <path d="M0,0 C40,-8 100,-35 200,-28 C160,-5 80,5 0,0 Z" fill="rgba(91,157,255,0.4)" stroke="#e8eefc" stroke-width="2"/>
    <line x1="-10" y1="0" x2="220" y2="0" stroke="#f0c14b" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="80" y="22" fill="#f0c14b" font-family="system-ui,sans-serif" font-size="12">chord line</text>
  </g>

  <!-- Angle arc -->
  <path d="M300,160 A40,40 0 0,0 285,145" fill="none" stroke="#ff9f6b" stroke-width="2.5"/>
  <text x="310" y="140" fill="#ff9f6b" font-family="system-ui,sans-serif" font-size="14" font-weight="700">AOA (α)</text>

  <!-- Horizon note -->
  <line x1="500" y1="200" x2="680" y2="200" stroke="rgba(154,168,199,0.5)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="500" y="190" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">Horizon (pitch attitude is different)</text>
  <text x="500" y="230" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="12">You can stall nose-low or</text>
  <text x="500" y="248" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="12">fly fine nose-high — AOA decides.</text>
</svg>
