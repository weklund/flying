<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Moment equals weight times arm; CG is total moment over total weight</title>
  <desc id="desc">
    Side view of a reference beam from the manufacturer datum. A weight sits at a distance (arm)
    aft of the datum. Labels show Moment = Weight × Arm and CG = sum of moments divided by total weight.
  </desc>
  <defs>
    <linearGradient id="wbBg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="wbArrow1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7ecbff"/>
    </marker>
  </defs>

  <rect width="720" height="320" rx="12" fill="url(#wbBg1)"/>

  <!-- Header -->
  <text x="28" y="32" fill="#3dd6c6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">CORE MATH</text>
  <text x="28" y="54" fill="#9aa8c7" font-family="system-ui, -apple-system, sans-serif" font-size="14">Everything is measured from the manufacturer datum</text>

  <!-- Ground reference strip -->
  <line x1="60" y1="200" x2="660" y2="200" stroke="rgba(232,238,252,0.35)" stroke-width="3"/>

  <!-- Datum plane (vertical) -->
  <line x1="120" y1="90" x2="120" y2="230" stroke="#f0c14b" stroke-width="3"/>
  <text x="120" y="80" text-anchor="middle" fill="#f0c14b" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">DATUM</text>
  <text x="120" y="250" text-anchor="middle" fill="#f0c14b" font-family="system-ui, -apple-system, sans-serif" font-size="11">reference plane</text>

  <!-- Airplane silhouette simplified (nose at datum-ish) -->
  <g transform="translate(120, 168)">
    <!-- fuselage from datum aft -->
    <ellipse cx="140" cy="0" rx="130" ry="16" fill="rgba(91,157,255,0.28)" stroke="#e8eefc" stroke-width="1.5"/>
    <!-- wing -->
    <ellipse cx="100" cy="0" rx="18" ry="48" fill="rgba(91,157,255,0.2)" stroke="rgba(232,238,252,0.5)" stroke-width="1"/>
    <!-- tail -->
    <path d="M250,-8 L280,-28 L280,-8 Z" fill="rgba(91,157,255,0.35)" stroke="#e8eefc" stroke-width="1"/>
    <path d="M255,0 L275,22 L255,8 Z" fill="rgba(91,157,255,0.35)" stroke="#e8eefc" stroke-width="1"/>
  </g>

  <!-- Arm dimension line from datum to item -->
  <line x1="120" y1="130" x2="420" y2="130" stroke="#7ecbff" stroke-width="2" marker-end="url(#wbArrow1)"/>
  <line x1="120" y1="124" x2="120" y2="136" stroke="#7ecbff" stroke-width="2"/>
  <line x1="420" y1="124" x2="420" y2="136" stroke="#7ecbff" stroke-width="2"/>
  <text x="270" y="120" text-anchor="middle" fill="#7ecbff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">arm (inches aft of datum)</text>

  <!-- Weight item at station -->
  <rect x="390" y="145" width="60" height="44" rx="6" fill="#5b9dff" stroke="#e8eefc" stroke-width="1"/>
  <text x="420" y="172" text-anchor="middle" fill="#061018" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">W</text>
  <text x="420" y="210" text-anchor="middle" fill="#e8eefc" font-family="system-ui, -apple-system, sans-serif" font-size="12">Item weight</text>
  <text x="420" y="226" text-anchor="middle" fill="#9aa8c7" font-family="system-ui, -apple-system, sans-serif" font-size="11">at its station</text>

  <!-- Vertical drop line from arm end to weight -->
  <line x1="420" y1="136" x2="420" y2="145" stroke="#7ecbff" stroke-width="1.5"/>

  <!-- Formula cards - clear, no overlap -->
  <rect x="40" y="265" width="300" height="40" rx="8" fill="#0a101c" stroke="rgba(91,157,255,0.45)"/>
  <text x="190" y="291" text-anchor="middle" fill="#7ecbff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Moment = Weight × Arm</text>

  <rect x="360" y="265" width="320" height="40" rx="8" fill="#0a101c" stroke="rgba(61,214,198,0.4)"/>
  <text x="520" y="291" text-anchor="middle" fill="#3dd6c6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">CG = Σ Moments ÷ Σ Weights</text>
</svg>
