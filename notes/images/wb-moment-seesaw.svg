<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="t1 d1">
  <title id="t1">Moment equals weight times arm; CG is balance point</title>
  <desc id="d1">Seesaw model with datum, arm, weight, and CG labeled.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="720" height="260" rx="12" fill="url(#bg)"/>
  <text x="24" y="28" fill="#3dd6c6" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="0.06em">MOMENT = WEIGHT × ARM</text>
  <text x="24" y="50" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="13">CG = total moment ÷ total weight · measured from the datum</text>

  <!-- Datum -->
  <line x1="80" y1="80" x2="80" y2="220" stroke="#f0c14b" stroke-width="3"/>
  <text x="88" y="95" fill="#f0c14b" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Datum</text>

  <!-- Beam -->
  <line x1="80" y1="160" x2="620" y2="160" stroke="rgba(232,238,252,0.5)" stroke-width="4"/>
  <!-- tick marks -->
  <line x1="200" y1="155" x2="200" y2="165" stroke="#9aa8c7" stroke-width="2"/>
  <line x1="350" y1="155" x2="350" y2="165" stroke="#9aa8c7" stroke-width="2"/>
  <line x1="500" y1="155" x2="500" y2="165" stroke="#9aa8c7" stroke-width="2"/>
  <text x="200" y="185" text-anchor="middle" fill="#9aa8c7" font-family="system-ui,sans-serif" font-size="11">arm</text>

  <!-- Weight block -->
  <rect x="470" y="100" width="60" height="50" rx="4" fill="#5b9dff"/>
  <text x="500" y="130" text-anchor="middle" fill="#061018" font-family="system-ui,sans-serif" font-size="12" font-weight="700">W</text>
  <text x="500" y="210" text-anchor="middle" fill="#7ecbff" font-family="system-ui,sans-serif" font-size="12">Item CG</text>
  <line x1="80" y1="140" x2="500" y2="140" stroke="#7ecbff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="280" y="130" fill="#7ecbff" font-family="system-ui,sans-serif" font-size="12">arm (inches aft of datum)</text>

  <!-- Formula box -->
  <rect x="100" y="200" width="400" height="40" rx="8" fill="#0a101c" stroke="rgba(91,157,255,0.35)"/>
  <text x="300" y="225" text-anchor="middle" fill="#7ecbff" font-family="ui-monospace,Menlo,monospace" font-size="14">Moment = W × arm &nbsp;·&nbsp; CG = ΣM / ΣW</text>
</svg>
